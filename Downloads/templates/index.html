<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHL Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main);
            margin: 0; padding: 20px; 
            background-image: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
            min-height: 100vh;
        }

        .header { 
            text-align: center; margin-bottom: 30px; font-weight: 300;
            letter-spacing: 1px; text-transform: uppercase;
            border-bottom: 2px solid var(--accent-blue);
            padding-bottom: 20px; max-width: 1200px; margin: 0 auto 30px auto;
        }

        .dashboard { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); 
            gap: 25px; max-width: 1200px; margin: 0 auto; 
        }

        .card { 
            background: var(--bg-card); backdrop-filter: blur(12px);
            border: 1px solid var(--border-color); padding: 25px; 
            border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .controls { 
            max-width: 1200px; margin: 0 auto 25px auto; 
            background: var(--bg-card); backdrop-filter: blur(12px);
            padding: 20px; border-radius: 16px; border: 1px solid var(--border-color);
            display: flex; align-items: center; gap: 15px; flex-wrap: wrap;
        }

        select { 
            padding: 12px 16px; font-size: 16px; border-radius: 8px; 
            border: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.8);
            color: var(--text-main); outline: none; min-width: 250px; cursor: pointer;
        }

        h3 { 
            margin-top: 0; color: var(--text-main); 
            border-bottom: 2px solid var(--border-color); padding-bottom: 15px; 
            font-weight: 500; display: flex; align-items: center; gap: 10px;
        }
        h3::before {
            content: ''; display: inline-block; width: 4px; height: 18px;
            background: var(--accent-blue); border-radius: 2px;
        }
        
        /* Адаптив для мобильных */
        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1 class="header">🏒 KHL Player Activity Dashboard</h1>
    
    <div class="controls">
        <label for="playerSelect"><b>Выберите игрока:</b></label>
        <select id="playerSelect" onchange="loadPlayerData()">
            <option value="">Загрузка списка...</option>
        </select>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>Динамика бросков (по матчам)</h3>
            <canvas id="lineChart"></canvas>
        </div>
        <div class="card">
            <h3>Карта бросков (сетка КХЛ)</h3>
            <canvas id="shotMap"></canvas>
        </div>
    </div>

    <script>
        let lineChartInstance = null;
        let shotMapInstance = null;

        document.addEventListener("DOMContentLoaded", function() {
            fetchPlayers();
        });

        function fetchPlayers() {
            fetch('/api/players')
                .then(res => res.json())
                .then(players => {
                    const select = document.getElementById('playerSelect');
                    select.innerHTML = '';
                    if (players.length === 0) {
                        select.innerHTML = '<option value="">Нет данных</option>';
                        return;
                    }
                    players.forEach(p => {
                        select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
                    });
                    // Автоматически выбираем первого и грузим данные
                    if(players.length > 0) loadPlayerData();
                })
                .catch(err => console.error("Ошибка загрузки игроков:", err));
        }

        function loadPlayerData() {
            const playerId = document.getElementById('playerSelect').value;
            if (!playerId) return;
            
            // Загрузка карты бросков
            fetch(`/api/shots/${playerId}`)
                .then(res => res.json())
                .then(shots => drawShotMap(shots));

            // Загрузка истории
            fetch(`/api/player/${playerId}/history`)
                .then(res => res.json())
                .then(history => drawLineChart(history.labels, history.data));
        }

        function drawLineChart(labels, data) {
            const ctx = document.getElementById('lineChart').getContext('2d');
            if (lineChartInstance) lineChartInstance.destroy();

            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(59, 130, 246, 0.5)');
            gradient.addColorStop(1, 'rgba(59, 130, 246, 0.05)');

            lineChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Броски',
                        data: data,
                        borderColor: '#3b82f6',
                        backgroundColor: gradient,
                        borderWidth: 3, tension: 0.4, fill: true,
                        pointBackgroundColor: '#fff', pointBorderColor: '#3b82f6',
                        pointRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: true, grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        function drawShotMap(shots) {
            const ctx = document.getElementById('shotMap').getContext('2d');
            const goals = shots.filter(s => s.shot_type === 1).map(s => ({ x: s.x, y: s.y }));
            const saves = shots.filter(s => s.shot_type === 2).map(s => ({ x: s.x, y: s.y }));

            if (shotMapInstance) shotMapInstance.destroy();

            shotMapInstance = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [
                        { label: 'Голы', data: goals, backgroundColor: '#ef4444', pointRadius: 7 },
                        { label: 'Сейвы', data: saves, backgroundColor: 'rgba(59, 130, 246, 0.6)', pointRadius: 5 }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: '#f1f5f9' } } },
                    scales: {
                        x: { min: 0, max: 1000, grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' }, title: {display:true, text:'X', color:'#94a3b8'} },
                        y: { min: 0, max: 500, grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' }, title: {display:true, text:'Y', color:'#94a3b8'} }
                    }
                }
            });
        }
    </script>
</body>
</html>
