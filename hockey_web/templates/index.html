<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>KHL Analytics Dashboard</title>
    <!-- Подключаем Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- ЦВЕТОВАЯ ПАЛИТРА В СТИЛЕ КХЛ --- */
        :root {
            --bg-main: #0f172a;         /* Глубокий тёмно-синий фон */
            --bg-card: rgba(30, 41, 59, 0.7); /* Полупрозрачный фон карточек */
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9;       /* Светлый текст */
            --text-muted: #94a3b8;      /* Серый текст */
            --accent-blue: #3b82f6;     /* Яркий синий (как на графике) */
            --accent-red: #ef4444;      /* Красный (для голов) */
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main);
            margin: 0; 
            padding: 20px; 
            /* Добавляем легкий градиент на фон для глубины */
            background-image: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
        }

        .header { 
            text-align: center; 
            margin-bottom: 30px; 
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-main);
            border-bottom: 2px solid var(--accent-blue);
            padding-bottom: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .dashboard { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 25px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* Стеклянные карточки */
        .card { 
            background: var(--bg-card); 
            backdrop-filter: blur(12px); /* Эффект размытия */
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px); /* Легкий подъем при наведении */
            border-color: rgba(59, 130, 246, 0.3);
        }

        .controls { 
            max-width: 1200px; 
            margin: 0 auto 25px auto; 
            background: var(--bg-card); 
            backdrop-filter: blur(12px);
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        select { 
            padding: 12px 16px; 
            font-size: 16px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-main);
            outline: none; 
            min-width: 250px;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--accent-blue);
        }

        h3 { 
            margin-top: 0; 
            color: var(--text-main); 
            border-bottom: 2px solid var(--border-color); 
            padding-bottom: 15px; 
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Добавляем маркеры к заголовкам, как в спортивной графике */
        h3::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background: var(--accent-blue);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <h1 class="header">🏒 KHL Player Activity Dashboard</h1>
    
    <div class="controls">
        <label for="playerSelect"><b>Выберите игрока:</b></label>
        <select id="playerSelect" onchange="loadPlayerData()">
            <option value="">Загрузка...</option>
        </select>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>Динамика бросков (по матчам)</h3>
            <canvas id="lineChart"></canvas>
        </div>
        <div class="card">
            <h3>Карта бросков (сетка КХЛ)</h3>
            <canvas id="shotMap"></canvas>
        </div>
    </div>

    <script>
        let lineChartInstance = null;
        let shotMapInstance = null;

        // 1. Загрузка списка игроков при старте
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/api/players')
                .then(response => {
                    if (!response.ok) throw new Error("Ошибка сервера");
                    return response.json();
                })
                .then(players => {
                    const select = document.getElementById('playerSelect');
                    select.innerHTML = ''; 
                    
                    if (players.length === 0) {
                        select.innerHTML = '<option value="">Нет игроков в БД</option>';
                        return;
                    }

                    players.forEach(p => {
                        select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
                    });
                    
                    loadPlayerData(); 
                })
                .catch(error => {
                    console.error("Ошибка при загрузке игроков:", error);
                    document.getElementById('playerSelect').innerHTML = '<option value="">Ошибка загрузки</option>';
                });
        });

        // 2. Загрузка данных и отрисовка графиков
        function loadPlayerData() {
            const playerId = document.getElementById('playerSelect').value;
            if (!playerId) return;
            
            fetch(`/api/shots/${playerId}`)
                .then(res => res.json())
                .then(shots => {
                    drawShotMap(shots);
                });

            fetch(`/api/player/${playerId}/history`)
                .then(res => res.json())
                .then(history => {
                    drawLineChart(history.labels, history.data);
                });
        }

        // 3. Отрисовка линейного графика (Цвета в стиле КХЛ)
        function drawLineChart(labels, data) {
            const ctx = document.getElementById('lineChart').getContext('2d');
            if (lineChartInstance) lineChartInstance.destroy();

            // Создаем градиент для линии
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(59, 130, 246, 0.5)'); // Синий
            gradient.addColorStop(1, 'rgba(59, 130, 246, 0.05)');

            lineChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Количество бросков',
                        data: data,
                        borderColor: '#3b82f6', // Яркий синий
                        backgroundColor: gradient,
                        borderWidth: 3,
                        tension: 0.4, // Плавная линия
                        fill: true,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#3b82f6',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#fff',
                            bodyColor: '#94a3b8',
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1
                        }
                    },
                    scales: { 
                        y: { 
                            beginAtZero: true, 
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8' }
                        }
                    }
                }
            });
        }

        // 4. Отрисовка карты бросков (в стиле КХЛ)
        function drawShotMap(shots) {
            const ctx = document.getElementById('shotMap').getContext('2d');
            
            const goals = shots.filter(s => s.shot_type === 1).map(s => ({ x: s.x, y: s.y }));
            const saves = shots.filter(s => s.shot_type === 2).map(s => ({ x: s.x, y: s.y }));

            if (shotMapInstance) shotMapInstance.destroy();

            shotMapInstance = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [
                        {
                            label: 'Голы',
                            data: goals,
                            backgroundColor: '#ef4444', // Красный (акцент)
                            pointRadius: 7,
                            pointHoverRadius: 9
                        },
                        {
                            label: 'Сейвы',
                            data: saves,
                            backgroundColor: 'rgba(59, 130, 246, 0.6)', // Синий
                            pointRadius: 5,
                            pointHoverRadius: 7
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: { color: '#f1f5f9' }
                        }
                    },
                    scales: {
                        x: { 
                            min: 0, max: 1000, 
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#94a3b8' },
                            title: { display: true, text: 'Координата X', color: '#94a3b8' } 
                        },
                        y: { 
                            min: 0, max: 500, 
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#94a3b8' },
                            title: { display: true, text: 'Координата Y', color: '#94a3b8' } 
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
